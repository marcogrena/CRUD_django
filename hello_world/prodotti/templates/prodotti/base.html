{# Template base HTML: layout comune, le altre pagine lo estendono con {% extends %} #}
<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Prodotti{% endblock %}</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        table { border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: .4rem .8rem; }
    </style>
</head>
<body>
    <h1>{% block heading %}Prodotti{% endblock %}</h1>
    {% block content %}{% endblock %}
</body>
</html>
